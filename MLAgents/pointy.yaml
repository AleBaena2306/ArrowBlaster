# Entrenamiento del agente de Pointy Dash (PPO).
# Uso: mlagents-learn MLAgents/pointy.yaml --run-id=pointy1   y después, en Unity, POINTY DASH > Bots > Entrenar con ML-Agents
behaviors:
  PointyDash:
    trainer_type: ppo
    hyperparameters:
      batch_size: 256
      buffer_size: 4096
      learning_rate: 3.0e-4
      beta: 5.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
    max_steps: 2000000
    time_horizon: 128
    summary_freq: 10000
engine_settings:
  time_scale: 1          # el juego avanza con pasos fijos (captureDeltaTime): no hace falta acelerar
  target_frame_rate: -1
  no_graphics: false
